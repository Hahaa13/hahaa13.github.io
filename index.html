<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random 1–40</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;display:flex;
         align-items:center;justify-content:center;min-height:100vh;margin:0;background:linear-gradient(135deg,#f8fafc,#e6eef8);}
    .card{background:white;padding:28px;border-radius:12px;box-shadow:0 8px 30px rgba(20,30,60,0.08);text-align:center;max-width:360px;width:90%;}
    h1{margin:0 0 10px;font-size:20px}
    #num{font-size:72px;font-weight:700;margin:14px 0;color:#0f172a;letter-spacing:2px;}
    button{cursor:pointer;padding:10px 16px;border-radius:8px;border:0;background:#0ea5e9;color:white;font-weight:600;font-size:16px}
    .row{display:flex;gap:10px;justify-content:center;margin-top:12px}
    .small{padding:8px 10px;border-radius:8px;border:1px solid #d1d5db;background:white;font-weight:600}
    #hint{font-size:13px;color:#475569;margin-top:8px}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Random number 1–40</h1>
    <div id="num" aria-live="polite">—</div>
    <div class="row">
      <button id="rnd">🎲 Random!</button>
      <button id="copy" class="small">Copy</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button id="min1" class="small">Min=1</button>
      <button id="max40" class="small">Max=40</button>
    </div>
    <div id="hint">Nhấn <strong>Space</strong> để random. Tự động chọn giá trị trong khoảng hiện tại.</div>
  </main>

  <script>
    let min = 1, max = 40;
    const numEl = document.getElementById('num');
    const rndBtn = document.getElementById('rnd');
    const copyBtn = document.getElementById('copy');
    const minBtn = document.getElementById('min1');
    const maxBtn = document.getElementById('max40');

    function randInt(a,b){
      a = Math.ceil(a); b = Math.floor(b);
      return Math.floor(Math.random() * (b - a + 1)) + a;
    }

    function show(n){
      numEl.textContent = n;
      // brief highlight animation
      numEl.animate([{transform:'scale(0.96)', opacity:0.8},{transform:'scale(1)',opacity:1}], {duration:180, easing:'ease-out'});
    }

    rndBtn.addEventListener('click', ()=> show(randInt(min,max)));
    copyBtn.addEventListener('click', ()=>{
      const text = numEl.textContent;
      if(!text || text === '—') return alert('Chưa có số để copy. Nhấn Random trước.');
      navigator.clipboard?.writeText(text).then(()=> alert('Copied: '+text), ()=> alert('Không thể copy. Hãy copy thủ công.'));
    });

    minBtn.addEventListener('click', ()=> {
      const v = prompt('Nhập min (số nguyên ≥ 1):', String(min));
      if(v===null) return;
      const nv = parseInt(v);
      if(Number.isInteger(nv) && nv >= 1 && nv < max){ min = nv; alert('Min set to '+min); }
      else alert('Giá trị không hợp lệ. Đảm bảo min ≥1 và < max.');
    });

    maxBtn.addEventListener('click', ()=> {
      const v = prompt('Nhập max (số nguyên ≤ 1000):', String(max));
      if(v===null) return;
      const nv = parseInt(v);
      if(Number.isInteger(nv) && nv > min && nv <= 1000){ max = nv; alert('Max set to '+max); }
      else alert('Giá trị không hợp lệ. Đảm bảo max > min và ≤ 1000.');
    });

    // keyboard support: Space to random, Enter on button
    document.addEventListener('keydown', (e)=>{
      if(e.code === 'Space'){ e.preventDefault(); rndBtn.click(); }
      if(e.key === 'Enter'){ if(document.activeElement === copyBtn) copyBtn.click(); }
    });

    // On load show a random one
    show('—');
  </script>
</body>
</html>
